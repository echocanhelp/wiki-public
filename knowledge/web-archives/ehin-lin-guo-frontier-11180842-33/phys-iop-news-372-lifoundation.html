<script>
document.getElementById('share-twitter').addEventListener('click', function() {
    var title = document.title; // 自動抓取頁面標題
    var url = window.location.href; // 自動抓取當前網址
    var text = encodeURIComponent(title);
    var tweetUrl = "https://twitter.com/intent/tweet?text=" + text + "&url=" + encodeURIComponent(url);
    window.open(tweetUrl, "_blank"); // 開新視窗分享
});
</script>

<!-- =================== 按鈕-複製URL ===================	-->
<script>
function copyUrl() {
  // 創建一個隱藏的輸入框
  var copyText = document.createElement("input");
  copyText.value = window.location.href; // 取得當前頁面的 URL
  document.body.appendChild(copyText);
  copyText.select();
  copyText.setSelectionRange(0, 99999); // For mobile devices

  // 嘗試複製到剪貼簿
  try {
	document.execCommand("copy");
	alert("Copied to clipboard!"); // 提示成功
  } catch (err) {
	alert("Error copying link. Please copy manually.");
  }

  // 移除隱藏的輸入框
  document.body.removeChild(copyText);
}
</script>
